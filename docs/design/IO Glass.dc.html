<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./nocturne-support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="nocturne/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
--pearl:rgba(255,255,255,.42);
--pearl-2:rgba(255,255,255,.26);
--pearl-3:rgba(255,255,255,.14);
--pearl-edge:rgba(255,255,255,.55);
--ink:#1d1f27;
--ink-2:#4b4f5c;
--ink-3:rgba(29,31,39,.42);
--hair:rgba(29,31,39,.09);
--glass:blur(34px) saturate(150%) brightness(1.06);
}
html{background:#c9c6d4}
body{margin:0;min-height:100%;background:#c9c6d4;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--color-accent-600)}
a:hover{color:var(--color-accent)}
@keyframes io-spin{to{transform:rotate(360deg)}}
@keyframes io-spinr{to{transform:rotate(-360deg)}}
@keyframes io-breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1}}
@keyframes io-halo{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.62;transform:scale(1.12)}}
@keyframes io-bar{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes io-caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes io-blip{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</helmet>

<!-- Implemented in frontend/ (2026-09-09). This file is the design reference —
     the pearl-glass shell in three modes: 3a standby, 3b conversation with the
     persistent history rail, 3c library (folders + photo grid + inspector).
     The live app drops the Phosphor CDN link (icons are vendored SVG in
     frontend/vendor/icons.js) and the <image-slot> wallpaper harness. -->

<section style="padding:44px 48px 40px">
<p style="font:400 13px/1.6 var(--font-body);color:var(--ink-2)">
IO — pearl glass shell, one window in three modes. Standby (orb, clock, ask bar);
expanded into chat with past chats on the left; the same window as files &amp;
folders. See <code>frontend/app.css</code> and <code>frontend/views/</code>.
</p>
</section>
</x-dc>
</body>
</html>
