<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IO</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="win">
    <div class="body">
      <nav class="rail" id="rail">
        <div class="rail-top">
          <span class="rail-brand">IO</span>
          <button class="rail-toggle" id="railtoggle" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
        </div>
        <div class="rail-nav" id="railnav"></div>
        <span class="grow"></span>
        <button class="rail-btn" data-nav="settings" title="Settings" aria-label="Settings"></button>
        <div class="rail-status mono" id="status"></div>
      </nav>
      <aside class="drawer" id="drawer" hidden></aside>
      <main id="view"></main>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
