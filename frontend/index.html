<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IO</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="win" id="win">
    <div class="winctl" id="winctl">
      <button class="winctl-btn" id="win-min" title="Minimize" aria-label="Minimize"></button>
      <button class="winctl-btn" id="win-full" title="Fullscreen" aria-label="Fullscreen"></button>
      <button class="winctl-btn danger" id="win-close" title="Close" aria-label="Close"></button>
    </div>
    <button class="gear" id="gear" title="Settings" aria-label="Settings"></button>
    <main id="view"></main>
    <aside class="drawer" id="drawer" hidden></aside>
    <div class="settings-scrim" id="settings-scrim" hidden></div>
    <aside class="settings" id="settings" hidden></aside>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
