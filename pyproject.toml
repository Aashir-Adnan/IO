[project]
name = "io-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "anthropic>=0.40",
    "rapidfuzz>=3.6",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywebview>=5.0",
    "sounddevice>=0.5.6",
    "numpy>=2.4.6",
    "piper-tts>=1.8.0",
    "faster-whisper>=1.2.1",
    "pynput>=1.8.2",
    "webrtcvad-wheels>=2.0.14",
    "python-multipart>=0.0.32",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
]

[project.scripts]
io = "io_assistant.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
markers = [
    "ollama: requires a running Ollama (set IO_OLLAMA_TESTS=1)",
    "anthropic: requires ANTHROPIC_API_KEY (set IO_ANTHROPIC_TESTS=1)",
    "voice: requires local Whisper/Piper models (set IO_VOICE_TESTS=1)",
    "ui: Playwright DOM smoke (set IO_UI_TESTS=1; needs `uv run playwright install chromium`)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
